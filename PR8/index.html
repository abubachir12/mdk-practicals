<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара из Figma — ПР8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Компонент, сверстанный по Pixel Perfect принципам из макета Figma -->
    <div class="product-card">
        <div class="badge">New</div>
        <div class="image-box">
            <img src="https://via.placeholder.com/260x180" alt="Беспроводные наушники">
        </div>
        <div class="card-content">
            <span class="category">Аудиотехника</span>
            <h3 class="title">Беспроводные наушники Pro Max</h3>
            <div class="rating">★★★★☆ <span>(4.8)</span></div>
            <div class="card-bottom">
                <div class="price">
                    <span class="current">12 990 ₽</span>
                    <span class="old">15 990 ₽</span>
                </div>
                <button class="buy-btn" aria-label="Купить">В корзину</button>
            </div>
        </div>
    </div>

</body>
</html>
